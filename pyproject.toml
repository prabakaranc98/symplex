[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symplex"
version = "0.1.0"
description = "Symplex — an agent-driven complex-system problem-solving engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "mlcroissant>=1,<2",
    "scikit-learn>=1.6,<2",
    "duckdb>=1.4,<2",
    "rdflib>=7,<8",
    "opentelemetry-sdk>=1.30,<2",
    "openai-agents>=0.20,<1",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
]

[project.scripts]
symplex = "symplex.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["symplex*"]
# The vertical packs ship without __init__.py; keep them inside the wheel.
namespaces = true

[tool.setuptools.package-data]
symplex = ["interfaces/web/*", "interfaces/web/views/*", "modeling/*.json", "domains/manifests/*.json", "domains/*.json", "agents/*.json", "agents/prompts/*.md", "connectors/*.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
